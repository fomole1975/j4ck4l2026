name: Linux x86 benchmark
on:
  workflow_dispatch:
    inputs:
      compare_commit:
        description: Optional 40-character commit for same-host practice, holdout and final comparisons
        type: string
        default: ''
      compiler_study:
        description: Compare ThinLTO, profile-guided compilation and output compression
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      KIT: https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files
      WORK: ${{ github.workspace }}/.work
    steps:
      - uses: actions/checkout@v4
      - name: Verify SIMD sort kernels against the standard library
        run: bash .github/scripts/test-sort-kernels.sh
      - name: Prepare public test kit
        run: |
          mkdir -p "$WORK"
          cd "$WORK"
          for kit in generator starter-duckdb dev-answer; do
            curl -fsSL --retry 3 "$KIT/$kit.zip" -o "$kit.zip"
            unzip -q "$kit.zip"
          done
          cargo build --offline --release --manifest-path generator/Cargo.toml
          python3 -m venv test-env
          test-env/bin/pip install polars==2.1.0
      - name: Build scoring image and inspect host CPU
        run: |
          lscpu
          docker build --platform linux/amd64 -t shopping-sessions .
      - name: Check public fixtures and development answer
        run: |
          export CPUS=$(nproc) MEM=8g
          chmod +x "$WORK/starter-duckdb/scripts/docker_run.sh"
          "$WORK/test-env/bin/python" "$WORK/starter-duckdb/scripts/run_fixtures.py" "$WORK/starter-duckdb/fixtures" -- "$WORK/starter-duckdb/scripts/docker_run.sh"
          "$WORK/generator/target/release/generate" --seed 1 --events 1000000 --clicks 250000 --output "$WORK/dev"
          "$WORK/starter-duckdb/scripts/docker_run.sh" "$WORK/dev" "$WORK/dev-out"
          "$WORK/test-env/bin/python" "$WORK/starter-duckdb/scripts/compare.py" "$WORK/dev-out" "$WORK/dev-answer"
          variants=(generic)
          if grep -qw avx2 /proc/cpuinfo; then variants+=(avx2); fi
          if grep -qw avx512bw /proc/cpuinfo; then variants+=(avx512); fi
          if grep -qw avx512_vbmi2 /proc/cpuinfo; then variants+=(vbmi2); fi
          for isa in "${variants[@]}"; do
            dest="$WORK/dev-$isa"
            mkdir -m 777 "$dest"
            docker run --rm --read-only --network none --user 1000:1000 \
              -e NCPU="$CPUS" -e SHOPPING_ISA="$isa" -v "$WORK/dev:/data:ro" \
              -v "$dest:/output" shopping-sessions
            "$WORK/test-env/bin/python" "$WORK/starter-duckdb/scripts/compare.py" "$dest" "$WORK/dev-answer"
          done
      - name: Time practice-size input on native x86
        run: |
          "$WORK/generator/target/release/generate" --seed 32741 --events 20000000 --clicks 5000000 --output "$WORK/practice"
          mkdir "$WORK/practice-out"
          chmod 777 "$WORK/practice-out"
          for config in "2:auto" "$(nproc):avx2" "$(nproc):auto" "$(nproc):auto"; do
            workers=${config%:*}
            isa=${config#*:}
            opts=()
            if [[ "$isa" != auto ]]; then opts=(-e "SHOPPING_ISA=$isa"); fi
            echo "Measuring $workers workers, $isa"
            /usr/bin/time -p docker run --rm --network none --read-only --memory=9g --memory-swap=9g \
              --user 1000:1000 "${opts[@]}" -e NCPU="$workers" -e PROFILE=1 \
              -v "$WORK/practice:/data:ro" -v "$WORK/practice-out:/output" shopping-sessions
          done
      - name: Time final-size input on native x86
        run: |
          "$WORK/generator/target/release/generate" --seed 817331 --events 60000000 --clicks 15000000 --output "$WORK/final"
          mkdir "$WORK/final-out"
          chmod 777 "$WORK/final-out"
          for run in 1 2 3; do
            echo "60M run $run"
            /usr/bin/time -p docker run --rm --network none --read-only --memory=12g --memory-swap=12g \
              --user 1000:1000 -e NCPU="$(nproc)" -e PROFILE=1 \
              -v "$WORK/final:/data:ro" -v "$WORK/final-out:/output" shopping-sessions
          done
      - name: Compare compiler and Parquet options on the same CPU
        if: inputs.compiler_study
        run: |
          docker build --target toolchain -t shopping-toolchain .
          docker run --rm -v "$PWD:/source:ro" -v "$WORK:/lab" shopping-toolchain bash /source/.github/scripts/compiler-study.sh
          for mode in base thin pgo; do
            "$WORK/test-env/bin/python" "$WORK/starter-duckdb/scripts/compare.py" "$WORK/check-$mode" "$WORK/dev-answer"
          done
      - name: Compare both images and their tables on three identical workloads
        if: inputs.compare_commit != ''
        env:
          BASE_SHA: ${{ inputs.compare_commit }}
        run: |
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$WORK/base-source" FETCH_HEAD
          docker build --platform linux/amd64 -t shopping-baseline "$WORK/base-source"
          "$WORK/generator/target/release/generate" --seed 774290 --events 20000000 --clicks 5000000 --output "$WORK/holdout"
          "$WORK/test-env/bin/python" .github/scripts/compare-images.py
